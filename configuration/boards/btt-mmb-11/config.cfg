# sections into your printer.cfg and change it there.
# WARNING: it is NOT recommended to override board_pins aliases, 
# use the boards pin names directly in your printer.cfg instead. 
# Look up the pins you need in the boards pinout diagram.

[board_pins btt_mmb_11_tmc2209]
aliases:
# steppers
  selector_step_pin=PB15,  selector_dir_pin=PB14,  selector_enable_pin=PA8,  selector_uart_pin=PA10,  selector_diag_pin=PA3,  selector_endstop_pin=PA3, # EZ Driver1
  fil_driver_step_pin=PD2,  fil_driver_dir_pin=PB13,  fil_driver_enable_pin=PD1,  fil_driver_uart_pin=PC7,  fil_driver_diag_pin=PA4,  fil_driver_endstop_pin=PA4, # EZ Driver2
  servo_selector_pin=PA0
  servo_cutter_pin=PA2
  toolhead_fil_sensor_pin=PA1